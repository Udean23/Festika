<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChemOrbit</title>
    <link rel="stylesheet" href="/Landing Page/css/style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="flex flex-col items-center justify-center min-h-screen px-4 text-white relative transition-all duration-700"
  >
    <!-- Header Section -->
    <header class="relative text-center mt-28 z-10 animate-fadeIn">
      <h1
        class="text-5xl md:text-7xl font-bold delius-swash-caps mb-10 text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-blue-400 drop-shadow-[0_0_20px_rgba(167,139,250,0.6)]"
      >
        ChemOrbit
      </h1>

      <div
        class="flex flex-col md:flex-row items-center justify-center gap-6 transition-all duration-500"
      >
        <a
          href="/Tata Surya/index.html"
          class="group relative px-8 py-3 border border-purple-400 bg-purple-900/30 text-purple-200 rounded-xl overflow-hidden transition-all duration-300 hover:scale-105"
        >
          <span
            class="absolute inset-0 bg-gradient-to-r from-purple-500/20 to-purple-400/20 opacity-0 group-hover:opacity-100 blur-md transition-all duration-500"
          ></span>
          <span class="relative delius-swash-caps tracking-wider">
            Tata Surya
          </span>
        </a>

        <a
          href="/Tabel Periodik/index.html"
          class="group relative px-8 py-3 border border-blue-400 bg-blue-900/30 text-blue-200 rounded-xl overflow-hidden transition-all duration-300 hover:scale-105"
        >
          <span
            class="absolute inset-0 bg-gradient-to-r from-blue-500/20 to-cyan-400/20 opacity-0 group-hover:opacity-100 blur-md transition-all duration-500"
          ></span>
          <span class="relative delius-swash-caps tracking-wider">
            Tabel Periodik
          </span>
        </a>
      </div>

      <style>
        @keyframes fadeIn {
          0% {
            opacity: 0;
            transform: translateY(30px);
          }
          100% {
            opacity: 1;
            transform: translateY(0);
          }
        }
        .animate-fadeIn {
          animation: fadeIn 1.2s ease-out forwards;
        }
      </style>
    </header>

    <section
      id="image-section"
      class="mt-20 w-full flex justify-center relative mb-10 z-10 cursor-pointer"
    >
      <!-- Gambar 1 -->
      <div
        id="img1"
        class="image-layer w-11/12 md:w-2/3 aspect-[16/9] rounded-2xl overflow-hidden shadow-2xl transform rotate-3 absolute top-8 opacity-70 transition-all duration-700 z-0"
      >
        <img
          src="/Landing Page/assets/periodic table.jpg"
          alt="Periodic Table"
          class="w-full h-full object-cover"
        />
      </div>

      <!-- Gambar 2 -->
      <div
        id="img2"
        class="image-layer w-11/12 md:w-2/3 aspect-[16/9] rounded-2xl overflow-hidden shadow-xl transform -rotate-2 relative opacity-100 transition-all duration-700 z-10"
      >
        <img
          src="/Landing Page/assets/solar system.jpg"
          alt="Solar System"
          class="w-full h-full object-cover"
        />
      </div>
    </section>
    <script src="script/script.js"></script>
  </body>
</html>
