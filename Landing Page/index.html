<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChemOrbit</title>
    <link rel="stylesheet" href="/Landing Page/css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="flex flex-col items-center justify-center min-h-screen px-4 text-white relative transition-all duration-700"
  >
    <!-- Header Section -->
    <header class="text-center mt-32 z-10">
      <h1
        class="text-5xl md:text-6xl font-bold delius-swash-caps mb-8 text-indigo-300"
      >
        ChemOrbit
      </h1>
      <div
        class="flex flex-col md:flex-row items-center justify-center gap-4 transition-all duration-500"
      >
        <button
          class="px-6 py-3 border border-indigo-400 bg-indigo-900/30 text-indigo-200 rounded-lg hover:bg-indigo-800/50 hover:shadow-[0_0_15px_rgba(167,139,250,0.6)] transition-all duration-300"
        >
          Tata Surya
        </button>
        <button
          class="px-6 py-3 border border-blue-400 bg-blue-900/30 text-blue-200 rounded-lg hover:bg-blue-800/50 hover:shadow-[0_0_15px_rgba(147,197,253,0.6)] transition-all duration-300"
        >
          Tabel Periodik
        </button>
      </div>
    </header>

    <section
      id="image-section"
      class="mt-20 w-full flex justify-center relative mb-10 z-10 cursor-pointer"
    >
      <!-- Gambar 1 -->
      <div
        id="img1"
        class="image-layer w-11/12 md:w-2/3 aspect-[16/9] rounded-2xl overflow-hidden shadow-2xl transform rotate-3 absolute top-8 opacity-70 transition-all duration-700 z-0"
      >
        <img
          src="/Landing Page/assets/periodic table.jpg"
          alt="Periodic Table"
          class="w-full h-full object-cover"
        />
      </div>

      <!-- Gambar 2 -->
      <div
        id="img2"
        class="image-layer w-11/12 md:w-2/3 aspect-[16/9] rounded-2xl overflow-hidden shadow-xl transform -rotate-2 relative opacity-100 transition-all duration-700 z-10"
      >
        <img
          src="/Landing Page/assets/solar system.jpg"
          alt="Solar System"
          class="w-full h-full object-cover"
        />
      </div>
    </section>
    <script src="script/script.js"></script>
  </body>
</html>
