<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Planet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Amaranth:wght@300;400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="./css/detail.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
  </head>
  <body class="m-0 p-0 bg-black text-white font-amaranth overflow-hidden">
    <div id="starfield" class="fixed inset-0 -z-10 bg-[#050505]"></div>

    <div class="fixed top-8 left-8 z-50 animate-fade-in">
      <button id="back-btn" class="flex items-center gap-2 text-white/70 hover:text-white transition-opacity text-sm">
        <i class="fa-solid fa-chevron-left"></i>
        <span>Kembali ke tata surya</span>
      </button>
    </div>

    <main class="relative z-10 grid grid-cols-1 lg:grid-cols-2 min-h-screen overflow-visible">
      <div class="flex flex-col justify-center px-12 lg:px-28 h-screen py-20 animate-slide-right overflow-y-auto">
        <div id="planet-name" class="text-5xl lg:text-7xl font-['Irish_Grover'] uppercase tracking-wider mb-3 leading-tight"></div>
        <div id="planet-type" class="text-base lg:text-lg text-white/70 lowercase mb-12 font-light"></div>

        <div class="relative justify-center items-center max-w-2xl h-auto overflow-hidden pl-8 min-h-[270px]">
          <div id="info-slider" class="relative w-full">
          </div>
        </div>

        <div class="mt-auto pt-16 flex gap-8 items-center pb-8 px-8">
            <div id="prev-planet" class="flex items-center gap-6 cursor-pointer group transition-all duration-300 hover:opacity-80">
                <div class="planet-nav-image w-12 h-12 rounded-full bg-cover bg-center border-2 border-white/40 group-hover:border-white shadow-lg transition-all"></div>
                <span class="text-base font-semibold group-hover:underline whitespace-nowrap text-white/90"></span>
            </div>
            <div id="next-planet" class="flex items-center gap-6 cursor-pointer group transition-all duration-300 hover:opacity-80 ml-auto">
                <span class="text-base font-semibold group-hover:underline whitespace-nowrap text-white/90"></span>
                <div class="planet-nav-image w-12 h-12 rounded-full bg-cover bg-center border-2 border-white/40 group-hover:border-white shadow-lg transition-all"></div>
            </div>
        </div>
      </div>

      <div id="planet-viewer" class="relative cursor-move min-h-[50vh] lg:min-h-screen animate-scale-in">
      </div>
    </main>

    <script src="dummy.js"></script>
    <script src="script.js"></script>
  </body>
</html>
