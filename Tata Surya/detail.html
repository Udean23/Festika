<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Planet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Amaranth:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/detail.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css"
    />
  </head>
  <body>
    <div class="fixed top-6 left-6 z-50">
      <button
        id="back-btn"
        class="back-btn flex items-center gap-2 px-4 py-2 rounded-full border-2 border-white text-white bg-black bg-opacity-30 backdrop-blur-sm"
      >
        <i class="fa-solid fa-arrow-left"></i>
        <span style="font-family: 'Amaranth', sans-serif">Kembali</span>
      </button>
    </div>

    <div
      class="min-h-screen max-h-screen justify-center items-center flex gap-10 text-white p-6"
    >
      <div
        class="flex flex-col max-w-[420px] items-start px-2"
        style="font-family: 'Amaranth', sans-serif"
      >
        <div id="planet-type" class="text-[20px]"></div>
        <div id="planet-desc" class="mt-4 text-justify leading-relaxed"></div>
      </div>

      <div class="planet mx-16">
        <div id="planet-name" class="planet-name"></div>
      </div>

      <div
        class="flex flex-col max-w-[420px] items-end text-right px-2 text-[15px]"
        style="font-family: 'Amaranth', sans-serif"
      >
        <div id="info-wrap" class="min-w-[420px] overflow-hidden">
          <div id="info-container" class="info-container"></div>
        </div>

        <div class="flex gap-10 mt-4">
          <div
            id="prev-btn"
            class="nav-btn border p-3 rounded-full cursor-pointer bg-white text-black"
          >
            <i class="fa-solid fa-arrow-left"></i>
          </div>
          <div
            id="next-btn"
            class="nav-btn border p-3 rounded-full cursor-pointer bg-white text-black"
          >
            <i class="fa-solid fa-arrow-right"></i>
          </div>
        </div>
      </div>
    </div>

    <script src="dummy.js"></script>
    <script src="script.js"></script>
  </body>
</html>
